
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title> world games</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b16;color:white;font-family:Arial}
header{padding:17px;background:#111a30;text-align:center;font-size:23px;font-weight:bold;letter-spacing:2px}
header span{color:#a78bfa}
main{max-width:950px;margin:auto;padding:15px}
canvas{width:100%;background:#111;border:2px solid #536080;border-radius:14px;display:block}
.hud{display:flex;justify-content:space-around;gap:8px;margin:10px 0}
.box{background:#19243a;padding:12px;border-radius:10px;text-align:center;flex:1}
.box strong{display:block;font-size:22px;color:#67e8f9}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
button,select{background:#263653;color:white;border:1px solid #ffffff30;border-radius:10px;padding:13px;font-weight:bold}
button:active{background:#9333ea}
.gears{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:12px}
.active{background:#9333ea}
h3{margin-bottom:8px}
#message{text-align:center;color:#c4b5fd;padding:10px}
</style>
</head>
<body>
<header>AAHARJI<span>.GAME</span> 🏎️</header>
<main>
<h2>NEON STREET RACING</h2>

<canvas id="game" width="800" height="450"></canvas>

<div class="hud">
 <div class="box">SPEED<strong id="speed">0 km/h</strong></div>
 <div class="box">GEAR<strong id="gear">N</strong></div>
 <div class="box">RPM<strong id="rpm">800</strong></div>
</div>
<div class="hud">
 <div class="box">DISTANCE<strong id="distance">0 m</strong></div>
 <div class="box">NITRO<strong id="nitro">100%</strong></div>
 <div class="box">BEST<strong id="best">0</strong></div>
</div>

<h3>⚙ GEARBOX</h3>
<div class="gears">
 <button onclick="changeGear(-1)">R</button>
 <button onclick="changeGear(0)">N</button>
 <button onclick="changeGear(1)">1</button>
 <button onclick="changeGear(2)">2</button>
 <button onclick="changeGear(3)">3</button>
 <button onclick="changeGear(4)">4</button>
 <button onclick="changeGear(5)">5</button>
 <button onclick="changeMode()">AUTO / MANUAL</button>
 <button onclick="toggleSound()">SOUND ON/OFF</button>
</div>

<h3>🎮 DRIVING</h3>
<div class="controls">
 <button id="left">⬅ LEFT</button>
 <button id="brake">🛑 BRAKE</button>
 <button id="right">RIGHT ➡</button>
 <button id="gas">🚀 ACCELERATOR</button>
 <button id="clutch">CLUTCH</button>
 <button id="boost">⚡ NITRO</button>
</div>

<div class="controls">
 <button onclick="startGame()">▶ START / RESTART</button>
 <button onclick="changeColor()">🎨 CHANGE CAR</button>
 <button onclick="pauseGame()">Ⅱ PAUSE</button>
</div>
<div id="message">Press START to race!</div>
</main>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let speed=0,gear=0,rpm=800,position=0;
let carX=0,road=0,nitro=100,best=0;
let running=false,paused=false,automatic=false;
let color="#a855f7",traffic=[],keys={};
let soundOn=true,clutch=false,boost=false,last=0;

const colors=["#a855f7","#ef4444","#06b6d4","#eab308","#f8fafc","#22c55e"];
let colorIndex=0;

function changeColor(){
 colorIndex=(colorIndex+1)%colors.length;
 color=colors[colorIndex];
}
function changeGear(g){
 if(automatic)return;
 if(Math.abs(speed)>10&&!clutch){
  message("Press CLUTCH before changing gear!");
  return;
 }
 gear=g;
 document.getElementById("gear").textContent=g===-1?"R":g===0?"N":g;
}
function changeMode(){
 automatic=!automatic;
 message(automatic?"Automatic mode ON":"Manual mode ON");
}
function toggleSound(){
 soundOn=!soundOn;
 message(soundOn?"Sound ON":"Sound OFF");
}
function beep(f=400){
 if(!soundOn)return;
 try{
  let a=new AudioContext(),o=a.createOscillator(),v=a.createGain();
  o.frequency.value=f;v.gain.value=.025;
  o.connect(v);v.connect(a.destination);
  o.start();o.stop(a.currentTime+.07);
 }catch(e){}
}
function message(t){
 document.getElementById("message").textContent=t;
}
function startGame(){
 speed=0;gear=0;rpm=800;position=0;nitro=100;
 carX=0;traffic=[];running=true;paused=false;
 last=0;
 message("Engine started. Let's race!");
 requestAnimationFrame(loop);
}
function pauseGame(){
 paused=!paused;
 message(paused?"Game paused":"Game resumed");
 if(!paused&&running)requestAnimationFrame(loop);
}
function hold(id,key){
 let el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();keys[key]=true});
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>
 el.addEventListener(ev,()=>keys[key]=false));
}
hold("gas","gas");hold("brake","brake");
hold("left","left");hold("right","right");
hold("clutch","clutch");hold("boost","boost");

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")keys.left=true;
 if(e.key==="ArrowRight")keys.right=true;
 if(e.key==="ArrowUp"||e.key==="w")keys.gas=true;
 if(e.key==="ArrowDown"||e.key==="s")keys.brake=true;
 if(e.key===" ")keys.boost=true;
 if(e.key==="Shift")keys.clutch=true;
});
document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft")keys.left=false;
 if(e.key==="ArrowRight")keys.right=false;
 if(e.key==="ArrowUp"||e.key==="w")keys.gas=false;
 if(e.key==="ArrowDown"||e.key==="s")keys.brake=false;
 if(e.key===" ")keys.boost=false;
 if(e.key==="Shift")keys.clutch=false;
});

function draw(){
 let w=800,h=450;
 let sky=ctx.createLinearGradient(0,0,0,h);
 sky.addColorStop(0,"#172b49");sky.addColorStop(1,"#16251e");
 ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);

 // Road
 ctx.fillStyle="#343943";
 ctx.beginPath();
 ctx.moveTo(245,0);ctx.lineTo(555,0);
 ctx.lineTo(760,450);ctx.lineTo(40,450);
 ctx.closePath();ctx.fill();

 // Road edges
 ctx.strokeStyle="#e5e7eb";ctx.lineWidth=7;
 ctx.beginPath();ctx.moveTo(245,0);ctx.lineTo(40,450);
 ctx.moveTo(555,0);ctx.lineTo(760,450);ctx.stroke();

 // Road markings
 ctx.strokeStyle="#facc15";ctx.lineWidth=5;
 for(let i=0;i<10;i++){
  let y=(i*70+road)%500;
  let width=3+y*.012;
  ctx.fillStyle="#f8fafc";
  ctx.fillRect(395-width/2,y,width,35);
 }

 // Traffic cars
 traffic.forEach(t=>{
  car(t.x,t.y,"#ef4444",.7);
 });

 // Player
 car(400+carX,345,color,1);
}
function car(x,y,col,scale){
 ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
 ctx.fillStyle="#080b12";
 ctx.fillRect(-32,5,12,35);ctx.fillRect(20,5,12,35);
 ctx.fillStyle=col;
 ctx.beginPath();
 ctx.moveTo(-25,30);ctx.lineTo(-22,-20);
 ctx.lineTo(-14,-42);ctx.lineTo(14,-42);
 ctx.lineTo(22,-20);ctx.lineTo(25,30);
 ctx.closePath();ctx.fill();
 ctx.fillStyle="#a5f3fc";
 ctx.fillRect(-15,-27,30,16);
 ctx.fillStyle="#fef3c7";
 ctx.fillRect(-19,22,9,5);ctx.fillRect(10,22,9,5);
 ctx.restore();
}
function loop(time){
 if(!running||paused)return;
 let dt=Math.min((time-last)/16||1,2);last=time;

 if(keys.gas){
  if(automatic){
   speed+=.12*dt;
   gear=Math.min(5,Math.max(1,Math.floor(speed/35)+1));
  }else if(gear>0&&!keys.clutch)speed+=.13*gear*dt;
  else if(gear===-1&& !keys.clutch)speed-=.08*dt;
 }
 if(keys.brake)speed-=.25*dt;
 if(keys.left)carX-=4*dt;
 if(keys.right)carX+=4*dt;
 if(keys.boost&&nitro>0){speed+=.25*dt;nitro-=.35*dt}
 else nitro=Math.min(100,nitro+.04*dt);
 if(keys.clutch)clutch=true;else clutch=false;

 speed=Math.max(-25,Math.min(260,speed));
 carX=Math.max(-290,Math.min(290,carX));
 road+=Math.max(1,speed*.12)*dt;
 position+=Math.abs(speed)*dt/60;

 if(Math.random()<.025+speed/15000){
  traffic.push({x:300+Math.random()*200,y:-60});
 }
 traffic.forEach(t=>t.y+=Math.max(2,speed*.09)*dt);
 traffic=traffic.filter(t=>t.y<500);

 traffic.forEach(t=>{
  if(Math.abs(t.x-(400+carX))<48&&Math.abs(t.y-345)<60){
   speed*=.93;
   message("⚠ Traffic! Be careful.");
  }
 });

 rpm=gear===0?800:Math.min(8500,800+speed*28);
 if(speed>best)best=Math.floor(speed);

 draw();
 document.getElementById("speed").textContent=Math.floor(Math.abs(speed))+" km/h";
 document.getElementById("gear").textContent=gear===-1?"R":gear===0?"N":gear;
 document.getElementById("rpm").textContent=Math.floor(rpm);
 document.getElementById("distance").textContent=position.toFixed(1)+" m";
 document.getElementById("nitro").textContent=Math.floor(nitro)+"%";
 document.getElementById("best").textContent=best;

 requestAnimationFrame(loop);
}
draw();
</script>
</body>
</html>
